# ==============================================================
# NOMBRE DE LA APLICACION
# ==============================================================
spring.application.name=api-libros-basica

# Puerto en el que levantará el servidor.
server.port=9080

# ==============================================================
# CONEXION A POSTGRESQL
# ==============================================================
# Primero crea manualmente una base de datos llamada:
# api_libros
#
# Después cambia username/password según tu instalación.
spring.datasource.url=jdbc:postgresql://localhost:5432/api_libros
spring.datasource.username=postgres
spring.datasource.password=CAMBIA_ESTA_CONTRASENA

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
# update:
# Hibernate compara las entidades con las tablas y crea/actualiza
# la estructura necesaria sin borrar los datos existentes.
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola.
spring.jpa.show-sql=true

# Hace que el SQL mostrado sea más legible.
spring.jpa.properties.hibernate.format_sql=true

# Evita que una sesión JPA permanezca abierta durante toda la petición web.
spring.jpa.open-in-view=false
